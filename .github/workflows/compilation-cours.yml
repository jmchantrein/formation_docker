name: Compilation des cours (Typst)

# Chaque cours est un dossier <cours>/ contenant <cours>/<cours>.typ ;
# le PDF est publié à côté : <cours>/<cours>.pdf (projection), plus une variante
# <cours>/<cours>-<variante>.pdf par rendu adapté (liste dans commun/theme-cours.typ).
on:
  push:
    branches: [main]
    paths:
      - "*/*.typ"
      - "commun/**"
      - ".github/workflows/compilation-cours.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilation-cours
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15"

      - name: Compilation
        run: |
          for src in */*.typ; do
            cours=$(dirname "$src")
            [ "$src" = "$cours/$cours.typ" ] || continue
            for variante in normal deuteranopie protanopie tritanopie achromatopsie dyslexie; do
              pdf="$cours/$cours.pdf"
              [ "$variante" = normal ] || pdf="$cours/$cours-$variante.pdf"
              echo "::group::$pdf"
              typst compile --root . --font-path commun/fonts --input variante="$variante" "$src" "$pdf"
              git add "$pdf"
              echo "::endgroup::"
            done
          done

      - name: Publication des PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "PDF inchangés, rien à publier."
          else
            git commit -m "Compile les PDF des cours"
            git push
          fi
